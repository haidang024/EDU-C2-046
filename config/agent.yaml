# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level. Runtime-tunable parameters
# live separately in config/config.yaml.
id: "EDU-C2-046"
name: "Curriculum Change Impact Briefing Agent"
namespace: "agent1000"
version: "1.0.2"
enabled: true
category: "Cat 2"
generation_mode: "llm"
industry: "EDU"

# Opaque compatibility metadata; this project inherits AgentBaseGraph directly.
base_type: "AgentBaseGraph"

# AgentRegistry expects one dotted import path, not split module/class fields.
class: "src.graph.graph.Graph"

# The outer pre/post-process nodes form the trust boundary.
required_trust_level: "VERIFIED_EXTERNAL"

# The curriculum connector is required by domain retrieval/mapping nodes. The
# Azure OpenAI credentials are invocation-scoped; provider failures retain the
# deterministic workflow result.
requires:
  secrets:
    - "CURRICULUM_CONNECTOR_API_KEY"
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]

# Runtime controls such as hitl and memory_enabled belong in config/config.yaml.
